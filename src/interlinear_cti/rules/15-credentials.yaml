# Credential access. Every rule is anchored at the command position ({cmd}, described in rules.py), so it has one
# start per line.

# A key name read by cat and the like, a key path or "PRIVATE KEY" searched by grep (grep id_rsa is only a search
# for the word), or a key looked for by find. A public key (.pub) is not one, and a find that deletes is cleanup.
- id: private-keys
  match:
    regex: '{cmd}(?:(?:cat|cp|scp|less|more|head|tail){end}.*(?<![\w.-])(?:id_rsa|id_dsa|id_ecdsa|id_ed25519)(?![\w-])(?!\.pub\b)|[efz]?grep{end}.*(?:/(?:id_rsa|id_dsa|id_ecdsa|id_ed25519)(?![\w-])(?!\.pub\b)|PRIVATE KEY)|find{end}(?!.*\s-delete\b|.*\s-(?:execdir|exec)\s+["\x27]?(?:[^\s|;&()<>"\x27`]*/)?(?:rm|shred|truncate){end}|.*\|\s*xargs\b[^|\n]*\b(?:rm|shred|truncate)\b).*(?:-i?name\s+["\x27]?\*?\.(?:pem|key|ppk)\b|(?<![\w.-])(?:id_rsa|id_dsa|id_ecdsa|id_ed25519)(?![\w-])(?!\.pub\b)))'
  meaning: Looks for or copies private keys, such as SSH keys.
  techniques: [T1552.004]
  artifacts: [Private Key]
  iocs: [path]
  confidence: high
  platforms: [linux, macos]
  examples:
    match:
      - "cat ~/.ssh/id_rsa"
      - "find /home -name id_rsa"
      - "find / -name '*.pem'"
      - "grep -r 'PRIVATE KEY' /home"
      - "scp root@10.0.0[.]5:~/.ssh/id_ed25519 ."
    no_match:
      - "ssh-keygen -t ed25519 -f id_ed25519"
      - "cat ~/.ssh/id_rsa.pub"
      - "grep -i id_rsa /var/log/auth.log"
      - "find / -name '*.pem' -delete"

- id: shadow-read
  match:
    regex: '{cmd}(?:cat|less|more|head|tail|cp|grep|unshadow){end}.*\s["\x27]?/etc/shadow\b'
  meaning: Reads or copies the password hash file (/etc/shadow).
  techniques: [T1003.008]
  artifacts: [Password Hash File]
  iocs: [path]
  confidence: high
  platforms: [linux]
  examples:
    match:
      - "cat /etc/shadow"
      - "sudo cp /etc/shadow /tmp/s"
      - "unshadow /etc/passwd /etc/shadow > h"
      - "sudo -u root cat /etc/shadow"
    no_match:
      - "ls -l /etc/shadow"
      - "echo /etc/shadow"

# Kubernetes secrets read through the API with kubectl (Container API, T1552.007): get or describe, with options
# before the resource (-o yaml, -n ns), and secrets anywhere in a resource list (secret,configmap) or by name
# (secret/db).
- id: container-secrets
  match:
    regex: '{stage}kubectl(?:[^\S\n]+(?:-n|--namespace|--context|--kubeconfig|--cluster)[^\S\n]+[^\s|;&()<>{}`-]{word}*|[^\S\n]+-{word}*){0,8}[^\S\n]+(?:get|describe)(?:[^\S\n]+(?:-[nolLc]|--namespace|--output|--selector|--field-selector|--sort-by|--context|--kubeconfig|--cluster)[^\S\n]+[^\s|;&()<>{}`-]{word}*|[^\S\n]+-{word}*){0,8}[^\S\n]+(?:[\w.-]+,)*secrets?(?:/[\w.-]+)?(?:,[\w./-]+)*{end}'
  meaning: Reads Kubernetes secrets, such as passwords, tokens and keys, through the cluster's API.
  techniques: [T1552.007]
  artifacts: [Credential]
  confidence: high
  examples:
    match: ["kubectl get secrets -A", "kubectl -n prod get secret db -o yaml", "kubectl describe secret db",
            "kubectl get secret,configmap -A", "kubectl get -o yaml secrets"]
    no_match: ["kubectl get pods", "kubectl create secret generic x", "echo kubectl get secret",
               "kubectl get configmaps -A", "kubectl get secretstores"]

# Browser stores read with sqlite3 or copied off: Chromium's Login Data, Web Data and Local State (which holds the
# key that decrypts them), and Firefox's logins.json, key4.db (key3.db, signons.sqlite on old versions). Each scan
# stays inside the command ({seg}).
- id: browser-credentials
  match:
    regex: '{cmd}(?:sqlite3|cp|scp|rsync|cat|strings|base64|xxd|tar|zip|7z|curl)(?:\.exe)?{end}{seg}*?(?:Login(?:\\ |[ _])Data|Web(?:\\ |[ _])Data|Local(?:\\ |[ _])State|key[34]\.db|logins\.json|signons\.sqlite)(?![\w.-])'
  meaning: Reads or copies a web browser's saved-password store, or the key that decrypts it.
  techniques: [T1555.003]
  artifacts: [File]
  iocs: [path]
  confidence: high
  examples:
    match:
      - "sqlite3 ~/.config/google-chrome/Default/'Login Data' 'select origin_url from logins'"
      - "cp ~/.mozilla/firefox/x.default/logins.json /tmp/"
      - "cp ~/.config/chromium/Default/Login\\ Data /tmp/ld"
      - "cat ~/.config/google-chrome/Local\\ State"
    no_match: ["sqlite3 app.db '.tables'", "ls ~/.config/google-chrome/Default", "echo Login Data"]

- id: browser-cookies
  match:
    regex: '{cmd}(?:sqlite3|cp|scp|rsync|cat|strings|base64|xxd|tar|zip|7z|curl)(?:\.exe)?{end}{seg}*?(?:/(?:Network/)?Cookies|cookies\.sqlite)(?![\w.-])'
  meaning: Reads or copies a web browser's cookie store, which can hold live session cookies.
  techniques: [T1539]
  artifacts: [File]
  iocs: [path]
  confidence: high
  examples:
    match:
      - "sqlite3 ~/.config/chromium/Default/Cookies 'select * from cookies'"
      - "cp ~/.mozilla/firefox/x.default/cookies.sqlite /tmp/c"
      - "cp ~/.config/google-chrome/Default/Network/Cookies /tmp/"
    no_match: ["sqlite3 app.db 'select * from cookies'", "echo Cookies"]
