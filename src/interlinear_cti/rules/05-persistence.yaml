# pm2 startup writes a boot service for the pm2 daemon (a systemd unit on a systemd host) and pm2 save records the
# processes it brings back, so together they make a program start again at every boot.
- id: pm2-startup
  match:
    regex: '{stage}pm2(?:[^\S\n]+-{word}*){0,8}[^\S\n]+(?:startup|save){end}'
  meaning: Registers the pm2 process manager as a boot service, or saves the processes it restarts at boot.
  techniques: [T1543.002]
  artifacts: [System Init Configuration]
  confidence: medium
  platforms: [linux]
  examples:
    match: ["pm2 startup", "pm2 startup systemd -u app --hp /home/app", "pm2 save", "pm2 start x.js && pm2 save"]
    no_match: ["pm2 list", "pm2 logs", "pm2 unstartup"]

