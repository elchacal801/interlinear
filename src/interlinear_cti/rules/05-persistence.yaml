      - "echo 'x ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/x"
      - "cp /tmp/s /etc/sudoers.d/s"
      - "sed -i 's/^#includedir/includedir/' /etc/sudoers"
      - "sudo visudo"
    no_match:
      - "cat /etc/sudoers"
      - "grep -r NOPASSWD /etc/sudoers.d/"
      - "sudo visudo -c"
      - "vim -R /etc/sudoers"

# Killing a competing miner is a cryptojacking step: ATT&CK's Exclusive Control (T1668) covers removing other
# malware from a compromised host, and its detection analytics name killing competing processes. T1489 (Service
# Stop) describes making services unavailable to legitimate users, which this is not.
- id: kill-competitor
  match:
    regex: '(?i){cmd}(?:(?:pkill|killall)(?=\s)|kill(?=\s)[^$`\n]*(?:\$\(|`)\s*(?:pgrep|pidof|ps)(?=\s)|(?:ps|pgrep|pidof)(?=\s)(?=.*\|\s*(?:sudo\s+)?xargs\b[^|\n]*\bkill\b)).*?\b(?:xmrig|xmr-stak|minerd|cpuminer|nbminer|t-rex|lolminer|kdevtmpfsi|kinsing|stratum)'
  meaning: Kills a competing cryptominer or known mining malware, to keep the host's compute for itself.
  techniques: [T1668]
  artifacts: [Process]
  confidence: medium
  platforms: [linux]
  examples:
    match:
      - "pkill -9 -f kdevtmpfsi"
      - "kill -9 $(pgrep xmrig)"
      - "killall -9 xmrig"
      - "ps aux | grep -v grep | grep kinsing | awk '{print $2}' | xargs kill -9"
      - "pgrep -f xmrig | xargs -r kill -9"
    no_match:
      - "pkill -f sshd"
      - "kill -9 1234"
      - "ps aux | grep xmrig"
